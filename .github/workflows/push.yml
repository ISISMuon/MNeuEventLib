name:  

on:
  push:

env: 
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt 
      - run: cargo fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  linux: 
    name: Run unit tests
    needs: [lint, format]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --verbose

  run_integration_tests:
    name: Integration tests
    needs: [lint, format]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-13]
        build: [stable, nightly]
        include:
          - build: stable
            mantid_channel: 'mantid'
          - build: nightly
            mantid_channel: 'mantid/label/nightly'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: "latest"
          channels: ${{ matrix.mantid_channel }},conda-forge
          channel-priority: flexible
          conda-remove-defaults: true
          activate-environment: mantid-env
          auto-activate-base: false

      - name: Configure conda network settings
        shell: bash -el {0}
        run: |
          conda config --set remote_connect_timeout_secs 30
          conda config --set remote_read_timeout_secs 120
          conda config --set remote_max_retries 5
          conda config --set remote_backoff_factor 3

      - name: Install Mantid and test deps
        shell: bash -el {0}
        env:
          MSYS_NO_PATHCONV: 1
          CONDA_OVERRIDE_OSX: "14"
        run: conda install -y -n mantid-env mantid pytest pip
      
      - name: Show resolved python version
        shell: bash -el {0}
        run: |
          conda activate mantid-env
          python --version

      - name: Install maturin into mantid-env
        shell: bash -el {0}
        run: |
          conda activate mantid-env
          python -m pip install maturin

      - name: Verify test deps installed
        shell: bash -el {0}
        run: |
          conda list -n mantid-env pytest
          conda activate mantid-env
          python -c "import pytest; print(pytest.__version__)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and install Rust extension into conda env
        shell: bash -el {0}
        run: |
          conda activate mantid-env
          python -m maturin develop --release

      - name: Run integration tests
        shell: bash -el {0}
        run: |
          conda activate mantid-env
          python -m pytest tests/integration/
  

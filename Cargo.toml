[package]
name = "MNeuEventLib"
version = "0.3.0"
edition = "2021"
license = "BSD-3-Clause"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "MNeuEventLib"
crate-type = ["cdylib"]

[dependencies]
hdf5 = { package = "hdf5-metno", version = "0.14.1", features = ["static"] }
hdf5-metno-sys = "0.12.3"
ndarray = "0.17.2"
rayon = "1.12.0"
anyhow = "1.0.102"
pyo3 = { version = "0.28.0", features = ["anyhow"] }
numpy = "0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["std"] }
tabled = "0.21.0"
seq-macro = "0.3"
wgpu = "24.0.0"
pollster = "0.4.0"
bytemuck = { version = "1.21.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
